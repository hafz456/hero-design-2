<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero (brutalist) | Bahasa Indonesia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #000;
      --white: #fff;
      --grey: #e6e6e6;
      --red: #e0132b;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      font-family: "Space Mono", "Courier New", monospace;
      background: var(--grey);
      color: var(--black);
    }

    /* ---------- Hero layout ---------- */
    #hero {
      min-height: 100svh;
      padding: clamp(24px, 5vw, 64px);
      display: flex;
    }

    .frame {
      flex: 1;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      border: 4px solid var(--black);
      background: var(--white);
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(28px, 4vw, 48px);
      padding: clamp(24px, 5vw, 64px);
    }

    #hero-title {
      font-family: "Archivo Black", Impact, "Arial Black", sans-serif;
      font-weight: 400;
      font-size: clamp(2rem, 6.2vw, 5.2rem);
      line-height: 1;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    /* ---------- Hard-edged pushable button ---------- */
    .btn {
      position: relative;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      outline-offset: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn .edge {
      position: absolute;
      inset: 0;
      background: var(--black);
    }

    .btn .front {
      position: relative;
      display: block;
      padding: 18px 44px;
      border: 4px solid var(--black);
      background: var(--red);
      color: var(--black);
      font-family: "Space Mono", "Courier New", monospace;
      font-weight: 700;
      font-size: 1.2rem;
      text-transform: uppercase;
      transform: translate(-8px, -8px);
      transition: transform 120ms ease;
    }

    .btn:hover .front { transform: translate(-10px, -10px); }
    .btn:active .front { transform: translate(0, 0); transition-duration: 30ms; }
    .btn:focus-visible { outline: 4px solid var(--black); }

    /* ---------- Phrase table ---------- */
    .phrases {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      border-top: 4px solid var(--black);
    }

    .phrases li {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 16px 20px;
      border-right: 4px solid var(--black);
      border-bottom: 4px solid var(--black);
      margin-bottom: -4px;
      margin-right: -4px;
    }

    .phrases b {
      font-family: "Archivo Black", Impact, "Arial Black", sans-serif;
      font-weight: 400;
      font-size: 1.35rem;
      text-transform: uppercase;
    }

    .phrases span {
      font-size: .95rem;
    }

    .frame { overflow: hidden; }

    @media (prefers-reduced-motion: reduce) {
      .btn .front { transition: none; }
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 700px) {
      #hero-title { font-size: clamp(2rem, 10vw, 3.2rem); }
      #hero-title br { display: none; }
    }
  </style>
</head>
<body>

  <section id="hero">
    <div class="frame">

      <div class="hero">
        <h1 id="hero-title">
          Discover Your<br />New World Through<br />Bahasa Indonesia.
        </h1>
        <button id="hero-btn" class="btn">
          <span class="edge"></span>
          <span class="front" id="hero-btn-text">Get Started</span>
        </button>
      </div>

      <ul class="phrases">
        <li><b>Halo</b><span>Hello</span></li>
        <li><b>Apa kabar?</b><span>How are you?</span></li>
        <li><b>Terima kasih</b><span>Thank you</span></li>
        <li><b>Sampai jumpa</b><span>See you later</span></li>
      </ul>

    </div>
  </section>

</body>
</html>
